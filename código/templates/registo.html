<!DOCTYPE html>
<html lang="pt-pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Registo</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <script src="{{ url_for('static', filename='script.js') }}" defer></script>


</head>
<body>
    <header>
        <a class="organization-header" href="{{ url_for('index') }}">Finances4You</a>
    </header>
    <h1>Registo</h1>

    {% for categoria, mensagem in get_flashed_messages(with_categories=true) %}
    <p class="aviso {{ categoria }}">{{ mensagem }}</p>
    {% endfor %}

    <form method="post" action="{{ url_for('registo') }}">
        <label for="nome">Nome:</label>
        <input type="text" id="nome" name="nome" required><br><br>

        <label for="apelido">Apelido:</label>
        <input type="text" id="apelido" name="apelido" required><br><br>

        <label for="email">Email:</label>
        <input type="email" id="email" name="email" required><br><br>

        <label for="password">Palavra-passe:</label>
        <div class="campo-password">
            <input type="password" id="password" name="password" minlength="8" required>
            <button type="button" class="mostrar-password" aria-label="Mostrar palavra-passe">👁</button>
        </div>

        <label for="password_confirmacao">Confirmar palavra-passe:</label>
        <div class="campo-password">
            <input type="password" id="password_confirmacao" name="password_confirmacao" minlength="8" required>
            <button type="button" class="mostrar-password" aria-label="Mostrar palavra-passe">👁</button>
        </div>

        <input type="submit" value="Criar Conta">
    </form>
    <h2>Já tem uma conta? <a href="{{ url_for('login') }}">Faça login aqui</a></h2>
</body>
</html>
